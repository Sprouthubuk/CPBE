<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instant win card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
@keyframes v9shine{from{transform:translateX(-150%) skewX(-20deg)}to{transform:translateX(350%) skewX(-20deg)}}
@keyframes v9glow{0%,100%{text-shadow:0 0 0 rgba(47,211,107,0)}50%{text-shadow:0 0 28px rgba(47,211,107,.55)}}
.v9c{transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s,box-shadow .45s}
.v9c:hover{transform:translateY(-6px);border-color:#2FD36B !important;box-shadow:0 24px 50px -24px rgba(47,211,107,.55)}
.v9c-bars{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.v9c:hover .v9c-bars{transform:translateX(-18px)}
.v9c-big{display:inline-block;transition:transform .6s cubic-bezier(.16,1,.3,1);animation:v9glow 3.2s ease-in-out infinite}
.v9c:hover .v9c-big{transform:scale(1.06) translateX(4px)}
.v9-btn{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.16,1,.3,1),filter .25s}
.v9-btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.v9-btn:active{transform:scale(.98)}
.v9-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-150%) skewX(-20deg);pointer-events:none}
.v9-btn:hover::after{animation:v9shine .9s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<article class="v9c" style="font-family: Barlow, system-ui, sans-serif; color: #F4F7F5; background: #0E1311; border: 1px solid #1E2723; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 100%; box-sizing: border-box">
<a href="/InstantWin.dc.html" aria-label="{{c.name}}" style="display: block; position: relative; aspect-ratio: 1 / 1; background: #0B2416; overflow: hidden; text-decoration: none; color: #F4F7F5">
<svg class="v9c-bars" viewBox="0 0 120 120" aria-hidden="true" preserveAspectRatio="none" style="position: absolute; right: 0; bottom: 0; width: 70%; height: 55%">
<polygon points="60,120 85,40 98,40 73,120" fill="#1B9A47" opacity="0.55"></polygon>
<polygon points="78,120 103,40 116,40 91,120" fill="#1B9A47" opacity="0.8"></polygon>
<polygon points="96,120 121,40 134,40 109,120" fill="#2FD36B"></polygon>
</svg>
<span style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 5px; background: #F4F7F5; color: #07090A; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px">
<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>Instant win</span>
<div style="position: absolute; left: 18px; top: 52px; display: flex; flex-direction: column">
<span class="v9c-big" style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 104px; line-height: 0.82; color: #2FD36B; letter-spacing: -0.02em">{{c.big}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 44px; line-height: 0.95; text-transform: uppercase">{{c.sub}}</span>
</div>
<span style="position: absolute; left: 18px; bottom: 18px; background: #07090A; border: 1px solid #2FD36B; color: #F4F7F5; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase; padding: 4px 10px; border-radius: 4px">Win up to <span style="color: #2FD36B">{{c.top}}</span></span>
</a>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 34px; line-height: 1; color: #2FD36B">{{c.price}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #C9D3CE; border: 1px solid #2B3A32; border-radius: 4px; padding: 3px 6px">
<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>{{c.prizes}} PRIZES</span>
</div>
<h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.1; text-transform: uppercase">{{c.name}}</h3>
<div style="font-size: 13px; color: #2FD36B; font-weight: 700">+ {{c.end}}</div>
<div style="font-size: 13px; color: #9AA8A1">End draw <strong style="color: #F4F7F5; font-weight: 600">{{c.draw}}</strong></div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto">
<div style="height: 6px; background: #1E2723; border-radius: 999px; overflow: hidden"><div style="height: 100%; width: 2%; background: #2FD36B; border-radius: 999px"></div></div>
<div style="font-size: 12px; color: #9AA8A1"><strong style="color: #F4F7F5">0%</strong> sold</div>
</div>
<a href="/InstantWin.dc.html" class="v9-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; background: #2FD36B; color: #04140A; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%)">Play now
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></a>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":300,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item ?? { name: 'Checkout Cash', big: '170', sub: 'Checkout Cash', top: '£170', price: '25p', prizes: 170, end: '£250 end prize', draw: 'Sun 29 Nov, 8pm' };
    return { c: it };
  }
}
</script>
</body>
</html>
