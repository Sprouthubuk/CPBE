<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault Nine header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.v9h-links{display:flex}
@media (max-width:900px){.v9h-links{display:none}}
.v9h-links a{transition:background-color .25s,color .25s,transform .25s cubic-bezier(.16,1,.3,1)}
.v9h-links a:hover{color:#F4F7F5 !important;background-color:#111715;transform:translateY(-1px)}
.v9h-icon{transition:border-color .25s,transform .25s cubic-bezier(.16,1,.3,1)}
.v9h-icon:hover{border-color:#2FD36B !important;transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</helmet>
<header style="font-family: Barlow, system-ui, sans-serif; color: #F4F7F5; background: #07090A; width: 100%">
<div style="background: #1B9A47; color: #04140A; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 20px">
<span style="border: 1.5px solid #04140A; border-radius: 4px; padding: 1px 6px">18+</span>
<a href="#" style="color: #04140A; text-decoration: underline; text-underline-offset: 3px">Free postal entry on every comp</a>
<span aria-hidden="true">/</span>
<span>Wins paid straight to your wallet</span>
<span aria-hidden="true">/</span>
<a href="#" style="color: #04140A; text-decoration: underline; text-underline-offset: 3px">Join the VIP WhatsApp</a>
</div>
<div style="border-bottom: 1px solid #1E2723">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="/Main.dc.html" aria-label="Vault Nine Competitions home" style="display: flex; align-items: center"><img src="../vault-nine-logo.png" alt="Vault Nine Competitions" style="height: 48px; width: auto; display: block"></a>
<nav class="v9h-links" aria-label="Main" style="gap: 4px; align-items: center">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="{{l.href}}" style="{{l.style}}">{{l.label}}</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<a href="#" aria-label="Wallet balance £0.00" class="v9h-icon" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border: 1px solid #2B3A32; border-radius: 999px; color: #F4F7F5; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px">
<span style="width: 30px; height: 30px; border-radius: 999px; background: #2FD36B; color: #04140A; display: flex; align-items: center; justify-content: center; font-family: Barlow, sans-serif; font-weight: 800">£</span>0.00</a>
<a href="#" aria-label="Basket, 0 items" class="v9h-icon" style="width: 44px; height: 44px; border: 1px solid #2B3A32; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #F4F7F5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"></path></svg></a>
<a href="#" aria-label="My account" style="width: 44px; height: 44px; border-radius: 999px; background: #F4F7F5; color: #07090A; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; text-decoration: none">L</a>
</div>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","competitions","instant","winners","entries"],"default":"home"},"$preview":{"width":1440,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = "padding: 10px 16px; border-radius: 6px; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; ";
    const on = base + "color: #04140A; background: #2FD36B; font-style: italic;";
    const off = base + "color: #C9D3CE;";
    const links = [
      { id: 'home', label: 'Home', href: '/Main.dc.html' },
      { id: 'competitions', label: 'Competitions', href: '/Competitions.dc.html' },
      { id: 'instant', label: 'Instant Wins', href: '/InstantWin.dc.html' },
      { id: 'winners', label: 'Winners', href: '#' },
      { id: 'entries', label: 'Entry Lists', href: '#' }
    ].map(l => ({ ...l, style: l.id === active ? on : off }));
    return { links };
  }
}
</script>
</body>
</html>
