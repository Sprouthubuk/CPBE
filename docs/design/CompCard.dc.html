<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live draw card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
@keyframes v9fill{from{transform:scaleX(0)}}
@keyframes v9shine{from{transform:translateX(-150%) skewX(-20deg)}to{transform:translateX(350%) skewX(-20deg)}}
@keyframes v9blink{0%,100%{opacity:1}50%{opacity:.35}}
.v9c{transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s,box-shadow .45s}
.v9c:hover{transform:translateY(-6px);border-color:#2FD36B !important;box-shadow:0 24px 50px -24px rgba(47,211,107,.55)}
.v9c-board{transition:transform 1.4s cubic-bezier(.16,1,.3,1),opacity .6s}
.v9c:hover .v9c-board{transform:rotate(54deg) scale(1.1);opacity:.5}
.v9c-name{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.v9c:hover .v9c-name{transform:translateY(-6px)}
.v9-bar{transform-origin:left center;animation:v9fill 1.6s cubic-bezier(.16,1,.3,1) .3s both}
.v9-urgent{animation:v9blink 1.4s ease-in-out infinite}
.v9-btn{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.16,1,.3,1),filter .25s}
.v9-btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.v9-btn:active{transform:scale(.98)}
.v9-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-150%) skewX(-20deg);pointer-events:none}
.v9-btn:hover::after{animation:v9shine .9s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<article class="v9c" style="font-family: Barlow, system-ui, sans-serif; color: #F4F7F5; background: #0E1311; border: 1px solid #1E2723; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 100%; box-sizing: border-box">
<a href="/LiveDraw.dc.html" aria-label="{{c.title}}" style="display: block; position: relative; aspect-ratio: 1 / 1; background: #0A0F0D; overflow: hidden; text-decoration: none">
<svg class="v9c-board" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -60px; bottom: -60px; width: 260px; height: 260px; opacity: 0.32">
<circle cx="100" cy="100" r="96" fill="#111715"></circle>
<circle cx="100" cy="100" r="86" fill="none" stroke="#1B9A47" stroke-width="10" stroke-dasharray="13.5 13.5"></circle>
<circle cx="100" cy="100" r="86" fill="none" stroke="#D7322B" stroke-width="10" stroke-dasharray="13.5 13.5" stroke-dashoffset="13.5"></circle>
<circle cx="100" cy="100" r="54" fill="none" stroke="#1B9A47" stroke-width="7" stroke-dasharray="8.48 8.48"></circle>
<circle cx="100" cy="100" r="54" fill="none" stroke="#D7322B" stroke-width="7" stroke-dasharray="8.48 8.48" stroke-dashoffset="8.48"></circle>
<circle cx="100" cy="100" r="11" fill="#1B9A47"></circle>
<circle cx="100" cy="100" r="5" fill="#D7322B"></circle>
</svg>
<span class="{{c.badgeCls}}" style="{{c.badgeStyle}}">{{c.badge}}</span>
<span style="position: absolute; top: 14px; right: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA8A1">Product photo</span>
<span class="v9c-name" style="position: absolute; left: 16px; right: 16px; bottom: 16px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 30px; line-height: 0.95; text-transform: uppercase; color: #F4F7F5">{{c.short}}</span>
</a>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 34px; line-height: 1; color: #2FD36B">{{c.price}}</span>
<s style="font-size: 14px; color: #8A9892">{{c.was}}</s>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #C9D3CE; border: 1px solid #2B3A32; border-radius: 4px; padding: 3px 6px">MAX {{c.max}}</span>
</div>
<h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em">{{c.title}}</h3>
<div style="font-size: 13px; color: #9AA8A1">Live draw <strong style="color: #F4F7F5; font-weight: 600">{{c.draw}}</strong></div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto">
<div style="height: 6px; background: #1E2723; border-radius: 999px; overflow: hidden"><div class="v9-bar" style="{{c.barStyle}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA8A1"><span><strong style="color: #F4F7F5">{{c.left}}</strong> of {{c.max}} left</span><span style="color: #2FD36B; font-weight: 700">{{c.offer}}</span></div>
</div>
<a href="/LiveDraw.dc.html" class="v9-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; background: #2FD36B; color: #04140A; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%)">Enter now
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":300,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item ?? { title: 'Olly Croft OBE — Limited Edition', short: 'Olly Croft OBE', price: '£1.49', was: '£1.99', max: 299, left: 298, draw: 'Wed 25 Nov, 8pm', offer: 'Buy 10 Get 5 Free', urgent: false };
    const pct = Math.round(((it.max - it.left) / it.max) * 100);
    const badgeBase = 'position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; ';
    return {
      c: {
        ...it,
        badge: it.urgent ? 'Ending soon' : 'Live draw',
        badgeCls: it.urgent ? 'v9-urgent' : '',
        badgeStyle: badgeBase + (it.urgent ? 'background: #D7322B; color: #FFFFFF;' : 'background: #2FD36B; color: #04140A;'),
        barStyle: 'height: 100%; width: ' + Math.max(pct, 2) + '%; background: ' + (it.urgent ? '#D7322B' : '#2FD36B') + '; border-radius: 999px;'
      }
    };
  }
}
</script>
</body>
</html>
